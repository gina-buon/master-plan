name: Sync Jira Tickets

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Jira tickets
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.parse
          import json
          import base64
          import os

          email = os.environ['JIRA_EMAIL']
          token = os.environ['JIRA_API_TOKEN']
          base_url = os.environ['JIRA_BASE_URL']

          credentials = base64.b64encode(f"{email}:{token}".encode()).decode()

          jql = "(assignee = 61377356ee2fd0006ac2806d OR reporter = 61377356ee2fd0006ac2806d) AND statusCategory != Done ORDER BY updated DESC"
          params = urllib.parse.urlencode({
              'jql': jql,
              'maxResults': 100,
              'fields': 'summary,status,issuetype,assignee,reporter'
          })

          url = f"{base_url}/rest/api/3/search?{params}"
          req = urllib.request.Request(url, headers={
              'Authorization': f'Basic {credentials}',
              'Accept': 'application/json'
          })

          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read())

          tickets = []
          for issue in data.get('issues', []):
              fields = issue.get('fields', {})
              assignee = fields.get('assignee') or {}
              reporter = fields.get('reporter') or {}
              tickets.append({
                  'key': issue['key'],
                  'summary': fields.get('summary', ''),
                  'status': (fields.get('status') or {}).get('name', ''),
                  'type': (fields.get('issuetype') or {}).get('name', ''),
                  'assignee': assignee.get('displayName', ''),
                  'reporter': reporter.get('displayName', ''),
                  'url': f"{base_url}/browse/{issue['key']}"
              })

          with open('jira-data.json', 'w') as f:
              json.dump(tickets, f, indent=2)

          print(f"Wrote {len(tickets)} tickets to jira-data.json")
          PYEOF

      - name: Commit jira-data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add jira-data.json
          git diff --staged --quiet || git commit -m "Auto-sync Jira tickets"
          git push
